<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間入力アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="language-buttons">
        <button data-lang="ja">日本語</button>
        <button data-lang="en">English</button>
        <button data-lang="tl">Tagalog</button>
        <button data-lang="vi">Tiếng Việt</button>
        <button data-lang="th">ไทย</button>
        <button data-lang="lo">ລາວ</button>
        <button data-lang="id">Indonesia</button>
        <button data-lang="zh">中文</button>
        <button data-lang="ko">한국어</button>
    </div>

    <h2 id="description">勤務時間を入力してください。</h2>

    <div id="days-container"></div>

    <div class="summary">
        <p><strong id="total-label">合計時間：</strong><span id="total-time">0:00</span></p>
        <p><strong id="days-label">出勤日数：</strong><span id="work-days">0</span></p>
    </div>

    <footer id="footer-text">入力内容に間違いがないか確認してください。</footer>

    <script src="script.js"></script>
</body>
</html>
